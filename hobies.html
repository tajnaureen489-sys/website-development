<html> 
    <head>
        <title>My hobby Cards</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- STEP 1 - bootsrap CSS link-->
         <link rel="stylesheet"
         href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
         <style>
            body { 
                background-color: #f9f9f9
                font-family: Arial, sans-serif;
                padding: 30px 15px;

            }
            h1 { 
                text-align: center;
                color: #FF5A43;

            }
            .hobby-card {
                text-align: center;
                border: 2px solid #FF5A43;
                border-radius: 8px;
                padding: 20px;
                margin-bottom: 20px;
                background-color:#fff8e1;

            }
            .hobby-card h3 { 
                color: #FF5A43
            }
         </style>
    </head>
    <body>
        <h1> My Hobby Cards
        </h1>
        <!-- STEP 2 - container keeps the layout neat and centered-->
         <div class="container">
         <div class="row">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Drawing</h3>
                    <p>I love to play video games and to play cricket</p>

                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                                    <h3>football
                 
                </h3>
                <p>i like to play football with friends</p>
            </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    
                    <h3>
                        Reading
                    </h3>
                    <p>My favourite books are adenture stories.</p>
                </div>
            </div>
         </div>

         </div>
    </body>
</html>
