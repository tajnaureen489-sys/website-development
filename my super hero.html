<html>
    <head>
        <title>
            My superhero Card
        </title>
        <style>

            /* Typography - font, size, weight, colour for the whole page */
            body { 
                background-color: darkblue;
                color: white;
                font-family: Arial, Helvetica, sans-serif;

            }
            /* typoghraphy + text shadow - big bold title with an orange shadow */
            .hero-name {
                font-size: 60px;
                color: yellow;
                text-shadow: 3px 3px orange;
                font-weight: bold;
            }
            /* typography + text transform - tagline becomes Title Case */ .tagline {
                font-style: italic;
                color: lightblue;
                text-transform: capitalize;

            }
            /* text transform + text decoration - section headings in CAPS with underline */
            .label {
                text-transform: uppercase;
                text-decoration: underline;
                color: coral;

            }
            /* typography - powes stand uot in bold green */ 
            .power { 
                font-weight: bold;
                color: lightgreen;

            }
            /* text decoration - weaknesses are crossed uot */
            .weakness {
                text-decoration: line-through;
                color: gray;

            }
            /* transform - the badge is title to the side */
            .bsdge { 
                font-size: 28px;
                font-weight: bold;
                color: gold;
                transform: rotate(15deg);
            }
            /* typography - footer text */
            .made-by {
                color: coral;
                font-style: italic;

            }
        </style>
    </head>
    <body>
        <h1 class="hero-name">Thumder Kid</h1>
        <p class="tagline">most powerful hero in the school</p>
        <h2 class="label"> super powers</h2>
        <p class="power">Can run faster then a cheeteh</p>
        <p class="power">can lift a school bus</p>

        <h2 class="label"weaknesses></h2>
        <p class="weakness">Maths homework</p>
        <p class="weakness"> broccoli</p>
        <p class="badge">Top Hero</p>
        <p class="made-by"> Created by Ahmad</p>
    </body>

</html>
